services:
  # The production-style entrypoint: proxies /api to the app and static
  # assets from the staging S3 bucket. Opt in with --profile proxy;
  # plain `docker-compose up` serves everything from the app on :3000.
  nginx:
    build: nginx/
    profiles: [proxy]
    ports:
      - '8080:8080'
    environment:
      VOLTTI_ENV: staging
      BASE_URL: 'http://localhost:8080'
      RESOLVER: 127.0.0.11
      SERVICE_URL: 'http://app:3000'
    depends_on:
      - app

  app:
    init: true
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      AD_MOCK: 'true'
      COOKIE_SECRET: 'verysecret'
      CRYPTO_SECRET_KEY: '01234567890123456789012345678901'
      API_BASE_URL: 'http://localhost:3000/'
      FRONTEND_BASE_URL: 'http://localhost:3000'
      RDS_DB_NAME: 'nuta'
      RDS_HOSTNAME: 'db'
      RDS_PASSWORD: 'password'
      REDIS_HOST: 'redis'
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'nuta'
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: '[ "$$(redis-cli -h 127.0.0.1 ping)" == "PONG" ]'
      interval: 1s
      timeout: 5s
      retries: 5

volumes:
  db-data:
